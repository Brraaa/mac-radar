name: Scan des offres MacBook Pro

on:
  # Déclencheur principal : cron-job.org appelle l'API GitHub toutes les 20 min (fiable)
  repository_dispatch:
    types: [scan]
  # Secours : le planificateur de GitHub (souvent en retard de plusieurs heures)
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Envoyer une notification de test"
        type: boolean
        default: false
      debug:
        description: "Journal détaillé"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Heure de départ
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scanner/package-lock.json
      - run: npm ci --omit=dev
        working-directory: scanner
      - name: Scanner les sources
        run: node scanner/scan.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TEST_PUSH: ${{ inputs.test_push }}
          DEBUG: ${{ inputs.debug }}
      - name: Enregistrer les résultats
        run: |
          git config user.name "mac-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/deals.json data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Scan $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
      - name: Programmer le prochain scan (dans 20 min)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait=$(( 1140 - ($(date +%s) - START) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          others=$(gh run list -R "$GITHUB_REPOSITORY" --workflow scan.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }} and (.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\" or .status == \"requested\"))] | length")
          if [ "${others:-0}" -eq 0 ]; then
            gh workflow run scan.yml -R "$GITHUB_REPOSITORY" --ref main
            echo "Prochain scan lancé."
          else
            echo "Un autre scan est déjà prévu : rien à faire."
          fi
