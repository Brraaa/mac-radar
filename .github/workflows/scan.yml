name: Scan des offres MacBook Pro

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Envoyer une notification de test"
        type: boolean
        default: false
      debug:
        description: "Journal détaillé"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scanner/package-lock.json
      - run: npm ci --omit=dev
        working-directory: scanner
      - name: Scanner les sources
        run: node scanner/scan.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TEST_PUSH: ${{ inputs.test_push }}
          DEBUG: ${{ inputs.debug }}
      - name: Enregistrer les résultats
        run: |
          git config user.name "mac-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/deals.json data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Scan $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
